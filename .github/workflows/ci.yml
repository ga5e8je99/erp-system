name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/masar_erp_test?schema=public"
  AUTH_SECRET: "ci-testing-secret-key-must-be-at-least-32-characters"
  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  CRON_SECRET: "ci_cron_secret"

jobs:
  ci:
    name: Continuous Integration & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: masar_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy

      - name: Seed Test Database
        run: npx tsx prisma/seed.ts

      - name: Run Vitest Suite (Unit & Integration)
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
