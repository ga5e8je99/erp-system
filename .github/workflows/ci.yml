name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/masar_erp_test?schema=public"
  AUTH_SECRET: "ci-testing-secret-key-must-be-at-least-32-characters"
  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  CRON_SECRET: "development_cron_secret_32_characters_long"

jobs:
  ci:
    name: Continuous Integration & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: masar_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Verify i18n Key Parity
        run: npx vitest run src/lib/__tests__/i18n-keys.test.ts

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy

      - name: Seed Production Essentials
        run: npm run db:seed:prod
        env:
          ADMIN_INITIAL_PASSWORD: "Admin@12345"

      - name: Run Vitest Suite (Unit & Integration)
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  e2e:
    name: Playwright E2E & Accessibility Tests
    needs: ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: masar_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy

      - name: Seed Production Essentials & Sample Dataset
        run: |
          npm run db:seed:prod
          npm run db:seed
        env:
          ADMIN_INITIAL_PASSWORD: "Admin@12345"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run Playwright Test Suite
        run: npm run test:e2e
        env:
          NODE_ENV: production
          CRON_SECRET: "development_cron_secret_32_characters_long"

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
